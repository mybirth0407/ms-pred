launcher_args: {experiment_name: marason_nist23,
  script_name: "src/ms_pred/marason/predict_gen.py",
  slurm_script: launcher_scripts/generic_slurm.sh,
  launch_method: local,
  visible_devices: [0, 1],
}
universal_args:
  _slurm_args:
  - {_num_gpu: 1, cpus-per-task: 7, job-name: forward_train, mem-per-cpu: 8G,
    time: '1-18:00:00'}
  debug: [false]
  gpu: [true]

  batch-size: [128]
  dataset-name: [nist23]
  num-gpu-workers: [4]
  num-cpu-workers: [32]
  threshold: [0.0]
  max-nodes: [100]
  num-decoys: [0]

iterative_args:
  -  split-name: [split_1.tsv]
     checkpoint-pth: [results/marason_nist23/split_1_rnd1/ckpt/gen/best.ckpt]
     save-dir: [split_1_rnd1/preds_train_100]

  -  split-name: [scaffold_1.tsv]
     checkpoint-pth: [results/marason_nist23/scaffold_1_rnd1/ckpt/gen/best.ckpt]
     save-dir: [scaffold_1_rnd1/preds_train_100]
