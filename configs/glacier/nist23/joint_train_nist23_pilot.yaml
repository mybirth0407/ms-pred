# GLACIER NIST'23 — PILOT (fold-swapped) subset. Single-GPU (avoids DDP RAM/lr gotchas).
# Trains on official scaffold_1 VAL fold (17,371 specs), validates on a molecule-disjoint
# slice of the official TRAIN fold (4,971 specs). No test fold.
# Outputs -> results/glacier_nist23/pilot_rnd1/ (baseline scaffold_1_rnd1 untouched). GPU 5.
launcher_args: {experiment_name: glacier_nist23,
  script_name: "src/ms_pred/glacier/train_joint.py",
  slurm_script: launcher_scripts/generic_slurm.sh,
  launch_method: local,
  visible_devices: [5]
}
universal_args:
  _slurm_args:
  - {_num_gpu: 1, cpus-per-task: 7, job-name: joint_train, mem-per-cpu: 8G,
    time: '1-12:00:00'}
  debug: [false]
  gpu: [true]

  seed: [1]
  num-workers: [4]
  batch-size: [16]
  max-epochs: [200]
  min-epochs: [20]

  dataset-name: [nist23]
  dataset-labels: [labels.tsv]
  magma-folder: [magma_outputs]
  split-name: [pilot_swapped_scaffold_1.tsv]

  learning-rate: [0.0004]
  lr-decay-rate: [0.9]
  weight-decay: [0]

  inten-dropout: [0.1]
  frag-dropout: [0.1]
  hidden-size: [256]
  graphormer-layers: [5]
  graphormer-dropout: [0.1]
  embed-elem-group: [True]
  add-hs: [True]
  embed-adduct: [True]
  embed-collision: [True]
  embed-instrument: [True]
  encode-forms: [True]
  inten-decoder-layers: [4]
  inten-encoder-layers: [3]
  frag-encoder-layers: [0]
  frag-decoder-layers: [4]
  max-broken-bonds: [6]
  max-breakpoints: [200]
  multi-hop-max-dist: [10]
  num-edge-dis: [10]
  num-bins: [15000]
  enable-aux-loss: [True]
  enable-decoder-norm: [False]
  sk-tau: [0.05]
  linsat-tau: [15]
  inten-weight: [1]
  frag-weight: [0.1]
  warmup: [2000]
  magma-warmup-steps: [2500]
  magma-decay-rate: [0.9]
  magma-decay-steps: [2500]
  inten-loss-fn: [cosine]

iterative_args:
  -  split-name: [pilot_swapped_scaffold_1.tsv]
     save-dir: [pilot_rnd1]
     seed: [1]
