# ICEBERG NIST'23 — PILOT (fold-swapped), STAGE 1 (fragment-DAG generator training).
# Trains on official scaffold_1 VAL fold, validates on a slice of the official TRAIN fold.
# Writes ckpt -> results/iceberg_nist23/pilot_rnd1/ckpt/gen/best.ckpt. GPU 6.
launcher_args: {experiment_name: iceberg_nist23,
  script_name: "src/ms_pred/iceberg/train_gen.py",
  slurm_script: launcher_scripts/generic_slurm.sh,
  launch_method: local,
  visible_devices: [6]
}
universal_args:
  _slurm_args:
  - {gpus: 1, cpus-per-task: 7, job-name: forward_train, mem-per-cpu: 8G,
    time: '1-18:00:00'}
  debug: [false]
  gpu: [true]

  seed: [1]
  num-workers: [16]
  batch-size: [32]
  max-epochs: [200]

  dataset-name: [nist23]
  split-name: [pilot_swapped_scaffold_1.tsv]

  learning-rate: [0.000996]
  lr-decay-rate: [0.7214]

  dropout: [0.2]
  mpnn-type: [GGNN]
  pe-embed-k: [14]
  pool-op: [avg]
  set-layers: [0]
  hidden-size: [512]
  weight-decay: [0.0]
  layers: [6]

  root-encode: [gnn]
  inject-early: [False]
  encode-forms: [True]
  embed-adduct: [True]
  embed-collision: [True]
  embed-elem-group: [True]
  add-hs: [true]

iterative_args:
  - split-name: [pilot_swapped_scaffold_1.tsv]
    save-dir: [pilot_rnd1]
    seed: [1]
