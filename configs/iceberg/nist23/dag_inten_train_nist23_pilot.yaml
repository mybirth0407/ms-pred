# ICEBERG NIST'23 — PILOT (fold-swapped), STAGE 2 (intensity model training).
# Trains on the self-predicted DAGs with true intensities (preds_train_100_inten.hdf5).
# Writes ckpt -> results/iceberg_nist23/pilot_rnd1/ckpt/inten/best.ckpt. GPU 6.
launcher_args: {experiment_name: iceberg_nist23,
  script_name: "src/ms_pred/iceberg/train_inten.py",
  slurm_script: launcher_scripts/generic_slurm.sh,
  launch_method: local,
  visible_devices: [6]
}
universal_args:
  _slurm_args:
  - {gpus: 1, cpus-per-task: 7, job-name: forward_train, mem-per-cpu: 8G,
    time: '1-18:00:00'}
  debug: [false]
  debug-overfit: [false]
  gpu: [true]

  seed: [1]
  num-workers: [16]
  batch-size: [32]
  max-epochs: [200]

  dataset-name: [nist23]
  split-name: [pilot_swapped_scaffold_1.tsv]

  learning-rate: [0.000736]
  lr-decay-rate: [0.825]

  dropout: [0.1]
  mpnn-type: [GGNN]
  pe-embed-k: [0]
  pool-op: [avg]
  hidden-size: [256]
  weight-decay: [1e-7]
  set-layers: [0]
  frag-set-layers: [3]
  mlp-layers: [1]
  gnn-layers: [4]
  loss-fn: [cosine]
  root-encode: [gnn]
  inject-early: [false]

  include-unshifted-mz: [true]
  binned-targs: [true]
  embed-adduct: [true]
  embed-collision: [true]
  embed-elem-group: [true]
  grad-accumulate: [1]
  encode-forms: [true]
  add-hs: [true]
  sk-tau: [0.05]
  ppm-tol: [20]

iterative_args:
  -  split-name: [pilot_swapped_scaffold_1.tsv]
     save-dir: [pilot_rnd1]
     magma-dag-folder: [results/iceberg_nist23/pilot_rnd1/preds_train_100_inten.hdf5]
     seed: [1]
