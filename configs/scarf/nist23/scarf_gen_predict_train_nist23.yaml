launcher_args: {experiment_name: scarf_nist23,
  script_name: "src/ms_pred/scarf_pred/predict_gen.py",
  slurm_script: launcher_scripts/generic_slurm.sh,
  launch_method: local,
  visible_devices: [0]
}
universal_args:
  _slurm_args:
  - {_num_gpu: 1, cpus-per-task: 7, job-name: forward_train, mem-per-cpu: 8G,
     time: '1-18:00:00'}
  debug: [false]
  gpu: [True]

  batch-size: [32]
  dataset-name: [nist23]

  num-workers: [0]
  threshold: [0.0]
  max-nodes: [300]

iterative_args:
  -  split-name: [split_1.tsv]
     checkpoint: [results/scarf_nist23/split_1_rnd1/version_0/best.ckpt]
     save-dir: [split_1_rnd1/preds_train_300]

  -  split-name: [scaffold_1.tsv]
     checkpoint: [results/scarf_nist23/scaffold_1_rnd1/version_0/best.ckpt]
     save-dir: [scaffold_1_rnd1/preds_train_300]
